name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-linux:
    name: Core + tests + Metal syntax (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y ninja-build clang

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: deps-linux-${{ hashFiles('cmake/Dependencies.cmake', 'tests/CMakeLists.txt') }}

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++

      - name: Build core and tests
        run: cmake --build build

      - name: Unit tests
        run: ctest --test-dir build --output-on-failure

      - name: Metal host code syntax check (metal-cpp + SDK stubs)
        run: cmake --build build --target metal_syntax_check

  app-macos:
    name: Metal 4 app (macOS, compile only)
    # Hosted macOS runners expose a paravirtual Apple GPU without Metal 4 runtime
    # support, so this job builds the app and compiles the shaders but does not
    # run it.  Runtime testing happens on a physical Apple silicon Mac.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: brew install ninja

      - name: Metal toolchain
        # Since Xcode 26 the Metal compiler is a separate component.
        run: |
          xcodebuild -version
          xcrun -sdk macosx metal --version || xcodebuild -downloadComponent MetalToolchain
          xcrun -sdk macosx metal --version

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: deps-macos-${{ hashFiles('cmake/Dependencies.cmake', 'tests/CMakeLists.txt') }}

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug

      - name: Build app, shaders and tests
        run: cmake --build build

      - name: Unit tests
        run: ctest --test-dir build --output-on-failure

      - name: Pipeline archive for all GPU architectures (F3.4)
        # The default (native) archive only holds the slice of the machine that
        # builds it, and the runner has no usable Metal 4 GPU.  Rebuild it for
        # every architecture and publish it together with the exact metallib
        # and the substituted pipelines script.  The archive targets the
        # runner's macOS (26.x): newer OS versions reject it ("not compatible
        # with current OS"), which is scenario (a) of tools/archive_check.sh
        # (CI_ARCHIVE=<downloaded phosphor-archive.metallib>).
        run: |
          # Shader debug info blocks metal-tt on specialised functions: the
          # Debug build rebuilds its shaders without it for the archive.
          cmake -S . -B build -DPHOSPHOR_ARCHIVE_ARCHS=all -DPHOSPHOR_SHADER_DEBUG_INFO=OFF
          cmake --build build --target phosphor_archive

      - name: Upload pipeline archive
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-archive-macos26
          if-no-files-found: error
          path: |
            build/shaders/phosphor-archive.metallib
            build/shaders/pipelines.mtl4-json
            build/shaders/phosphor.metallib
